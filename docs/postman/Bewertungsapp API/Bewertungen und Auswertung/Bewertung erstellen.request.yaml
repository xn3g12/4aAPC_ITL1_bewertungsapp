$kind: http-request
url: "{{baseUrl}}/evaluations"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "projectId": "{{projectId}}",
      "criterionId": "{{criterionId}}",
      "jurorId": "{{jurorId}}",
      "score": 8,
      "comment": "Gute Umsetzung"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status ist 201 Created', function () {
        pm.response.to.have.status(201);
      });
      pm.test('Bewertung enthaelt ID und uebermittelte Punktzahl', function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property('id');
        pm.expect(json.score).to.eql(8);
        pm.environment.set('evaluationId', json.id);
      });
    language: text/javascript
order: 1000
