$kind: http-request
url: "{{baseUrl}}/teams"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status ist 200 OK', function () {
        pm.response.to.have.status(200);
      });
      pm.test('Antwort ist eine Team-Liste', function () {
        pm.expect(pm.response.json()).to.be.an('array');
      });
    language: text/javascript
order: 2000
